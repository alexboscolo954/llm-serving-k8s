apiVersion: apps/v1
kind: StatefulSet   # one weights cache per replica (docs/adr/0002)
metadata:
  name: vllm-chat
  labels: {app: vllm-chat}
spec:
  # No replicas: KEDA owns the count (autoscaling/), a re-apply must not reset it.
  # Rolling updates replace one pod at a time, deleting before creating: no surge pod.
  serviceName: vllm-chat
  podManagementPolicy: Parallel   # a new replica need not wait for the others to be Ready
  selector:
    matchLabels: {app: vllm-chat}
  template:
    metadata:
      labels: {app: vllm-chat}
    spec:
      containers:
        - name: vllm
          # Multi-arch tag: amd64 and arm64 (Docker Desktop on Apple silicon).
          image: vllm/vllm-openai-cpu:v0.31.0
          args:
            - Qwen/Qwen2.5-0.5B-Instruct
            - --port=8000
            - --dtype=bfloat16
            - --max-model-len=2048
            - --max-num-seqs=4   # a few CPU cores gain nothing from bigger batches; extra requests queue, KEDA's signal
          env:
            - {name: VLLM_CPU_KVCACHE_SPACE, value: "1"}   # GiB
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: nobind}   # "auto" pins to 1 core on a 4-vCPU SMT runner
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            capabilities: {add: [SYS_NICE]}   # NUMA/thread binding
          startupProbe:   # first start downloads ~1 GB of weights
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 3Gi}   # no CPU limit: uses all cores
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: hf-cache}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-chat
spec:
  selector: {app: vllm-chat}
  ports:
    - {name: http, port: 8000, targetPort: http}
