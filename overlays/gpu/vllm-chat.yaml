# Chat model on a dedicated GPU, weights quantized to FP8 at load time.
# FP8 roughly halves weight memory vs BF16, leaving more room for KV cache
# (needs Ada/Hopper or newer).
apiVersion: apps/v1
kind: StatefulSet   # one weights cache per replica (docs/adr/0002)
metadata:
  name: vllm-chat
  labels: {app: vllm-chat}
spec:
  # No replicas: KEDA owns the count (autoscaling/), a re-apply must not reset it.
  # Rolling updates replace one pod at a time, deleting before creating: no surge pod needing a second GPU.
  serviceName: vllm-chat
  podManagementPolicy: Parallel   # a new replica need not wait for the others to be Ready
  selector:
    matchLabels: {app: vllm-chat}
  template:
    metadata:
      labels: {app: vllm-chat}
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
        nvidia.com/device-plugin.config: dedicated
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          args:
            - Qwen/Qwen3-8B
            - --port=8000
            - --quantization=fp8
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token, optional: true}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: "4", memory: 32Gi, nvidia.com/gpu: 1}
            limits: {memory: 48Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
  volumeClaimTemplates:
    - metadata: {name: hf-cache}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-chat
spec:
  selector: {app: vllm-chat}
  ports:
    - {name: http, port: 8000, targetPort: http}
