# One violation per rule. `make validate` expects every one of them to fail.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-no-probes}
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.31.0
          resources: {limits: {memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-no-gpu}
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          startupProbe: {httpGet: {path: /health, port: 8000}}
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          resources: {limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-exposed}
spec:
  type: NodePort
  selector: {app: x}
  ports: [{port: 80}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: unpinned}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: x, image: "busybox:latest"}]
