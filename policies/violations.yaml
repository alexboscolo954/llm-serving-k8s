# One violation per rule. `make validate` expects every one of them to fail.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-no-probes}
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.31.0@sha256:495c84fe30f3572b83a78100a1e8ba423dbb77fc532ecefebe114e6b77327bd9
          resources: {limits: {memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-no-gpu}
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          startupProbe: {httpGet: {path: /health, port: 8000}}
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          resources: {limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-exposed}
spec:
  type: NodePort
  selector: {app: x}
  ports: [{port: 80}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: tag-without-digest}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: x, image: "busybox:1.37"}]
