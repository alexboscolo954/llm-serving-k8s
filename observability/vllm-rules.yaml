# Unit-tested in observability/vllm-rules.test.yaml (`make validate`).
# Thresholds are starting points for a GPU Backend, not tuned values.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm
  namespace: llm
spec:
  groups:
    - name: vllm
      rules:
        - alert: VLLMTimeToFirstTokenHigh
          expr: |
            histogram_quantile(0.95, sum by (model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 2
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "p95 time to first token above 2s for {{ $labels.model_name }}"
        - alert: VLLMKVCacheNearlyFull
          # Past this point new requests wait for cache space instead of starting.
          expr: max by (model_name) (vllm:kv_cache_usage_perc) > 0.9
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "KV cache above 90% for {{ $labels.model_name }}"
        - alert: VLLMQueueGrowing
          # A queue that only grows: the Backend is short of capacity, not just busy.
          expr: |
            max by (model_name) (deriv(vllm:num_requests_waiting[10m])) > 0
            and max by (model_name) (vllm:num_requests_waiting) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Waiting requests growing for 10m on {{ $labels.model_name }}"
