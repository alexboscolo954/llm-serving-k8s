# Istio as the inference gateway only (base/chat-routing.yaml): no sidecars, no mesh.
env:
  ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
  SUPPORT_GATEWAY_API_INFERENCE_EXTENSION: "true"
autoscaleEnabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}   # chart default 500m / 2Gi; a 4-vCPU kind node also runs two vLLM replicas
