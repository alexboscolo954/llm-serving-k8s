# helm install gpu-operator nvidia/gpu-operator --version v26.7.1 \
#   -n gpu-operator --create-namespace -f platform/gpu-operator-values.yaml
# Apply platform/time-slicing-config.yaml first.
# Driver and container toolkit are on by default (driver.enabled=false if the node image ships the driver).
devicePlugin:
  config:
    name: device-plugin-config
    default: dedicated   # nodes without the label get no sharing
dcgmExporter:            # on by default: GPU metrics for Prometheus
  serviceMonitor:
    enabled: true        # needs the Prometheus Operator CRDs
    # Keep the exporter's pod/namespace/container labels (the pod using the GPU). Without this Prometheus
    # renames them exported_* and fills in the exporter's own pod, so OpenCost finds no GPU usage per Backend.
    honorLabels: true
