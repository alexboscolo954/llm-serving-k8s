# helm install gpu-operator nvidia/gpu-operator --version v26.7.1 \
#   -n gpu-operator --create-namespace -f platform/gpu-operator-values.yaml
# Apply platform/time-slicing-config.yaml first.
driver:
  enabled: true          # set false if the node image ships the NVIDIA driver
toolkit:
  enabled: true
devicePlugin:
  config:
    name: device-plugin-config
    default: dedicated   # nodes without the label get no sharing
dcgmExporter:
  enabled: true          # GPU metrics for Prometheus
  serviceMonitor:
    enabled: true        # needs the Prometheus Operator CRDs
