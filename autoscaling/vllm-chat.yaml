# Scale the chat Backend on requests waiting in vLLM's queue, not on GPU or CPU
# utilization: a busy Backend that keeps up runs near 100% and needs nothing.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vllm-chat
  minReplicaCount: 1   # no scale to zero: a GPU cold start takes minutes (docs/adr/0002)
  maxReplicaCount: 2   # one per GPU you can spare; 2 is what CI's single kind node holds
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Longer than a cold start, so a replica that is still loading weights isn't removed
          # because the queue drained meanwhile.
          stabilizationWindowSeconds: 600
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: sum(vllm:num_requests_waiting{namespace="llm", pod=~"vllm-chat-[0-9]+"})
        metricType: AverageValue
        threshold: "4"   # waiting requests per replica
