name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: make validate

  e2e-cpu:
    # Real end-to-end run: kind + vLLM CPU + LiteLLM, then a chat completion.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: llm-serving
          config: overlays/cpu-kind/kind-config.yaml
      - run: make up
      - run: make smoke
      - if: failure()
        run: |
          kubectl -n llm get pods -o wide
          kubectl -n llm describe pods
          kubectl -n llm logs deploy/vllm-chat --tail=200
          kubectl -n llm logs deploy/litellm --tail=100
