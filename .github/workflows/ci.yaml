name: ci
on:
  push: {branches: [main]}
  pull_request:

# One kind cluster per milestone, in parallel: a 4-vCPU / 16 GB runner
# would crawl with every Backend and add-on on one node.
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: 1.15.5, terraform_wrapper: false}
      - name: Install kubeconform, kyverno, promtool, pytest
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sL https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz | tar xz kyverno
          curl -sL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          sudo mv kubeconform kyverno promtool /usr/local/bin/
          pip install pytest==9.0.2 pyyaml==6.0.3
      - run: make validate

  e2e-gateway:
    # kind + vLLM CPU (chat + embed) + LiteLLM and its Postgres: e2e and Tenant tests, then a small load test.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest==9.0.2
      - uses: azure/setup-helm@v5
      - name: Runner size
        run: nproc && free -g
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0   # kindnet enforces NetworkPolicy; same version as local runs
          cluster_name: llm-serving
          config: overlays/cpu-kind/kind-config.yaml
      - run: make up
      - run: make test
      - run: make bench RUN=ci
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: bench-ci, path: bench/results/ci, if-no-files-found: ignore}
      - if: failure()
        run: |
          kubectl -n llm get pods -o wide
          kubectl -n llm describe pods
          make logs-chat
          kubectl -n llm logs deploy/vllm-embed --tail=100
          kubectl -n llm logs deploy/litellm --tail=100
          kubectl -n llm get cluster,netpol,gateway,httproute,inferencepool
          kubectl -n llm logs deploy/chat-epp --tail=100 || true
          kubectl -n llm logs deploy/inference-gateway-istio --tail=50 || true
          kubectl -n llm logs job/litellm-metrics-key --tail=20 || true

  e2e-observability:
    # Same stack plus kube-prometheus-stack: scraping, dashboard queries and alert rules on a live cluster.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest==9.0.2
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0   # kindnet enforces NetworkPolicy; same version as local runs
          cluster_name: llm-serving
          config: overlays/cpu-kind/kind-config.yaml
      - run: make up
      - run: make observe
      - run: make test-observability
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n monitoring describe pods || true
          kubectl -n monitoring logs statefulset/prometheus-kube-prometheus-stack-prometheus --tail=100 || true
          make logs-chat
          kubectl -n llm logs deploy/litellm --tail=100

  e2e-autoscaling:
    # Same stack plus Prometheus and KEDA: under load the chat Backend scales 1 -> 2.
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # the second CPU replica warms up next to a saturated first one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest==9.0.2
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0   # kindnet enforces NetworkPolicy; same version as local runs
          cluster_name: llm-serving
          config: overlays/cpu-kind/kind-config.yaml
      - run: make up
      - run: make observe
      - run: make autoscale
      - run: make test-autoscaling
      - if: failure()
        run: |
          kubectl -n llm get pods,pvc,hpa,scaledobject -o wide
          kubectl -n llm describe sts/vllm-chat scaledobject/vllm-chat
          make logs-chat
          make logs-chat POD=vllm-chat-1
          kubectl -n llm logs deploy/chat-epp --tail=100 || true
          kubectl -n llm get pods -o custom-columns='POD:.metadata.name,RESTARTS:.status.containerStatuses[*].restartCount,REASON:.status.containerStatuses[*].lastState.terminated.reason,EXIT:.status.containerStatuses[*].lastState.terminated.exitCode'
          kubectl -n llm get events --sort-by=.lastTimestamp | tail -150
          for p in deploy/chat-epp deploy/litellm pod/litellm-db-1; do kubectl -n llm logs $p --previous --tail=60 || true; done
          free -m
          kubectl describe node | sed -n '/Allocated resources/,/Events/p'
          kubectl -n keda logs deploy/keda-operator --tail=100
