# Load test through the Gateway with vLLM's own benchmark client.
# Uses the CPU vLLM image on every cluster: the client needs no GPU, and the
# image is already on the node in kind. Each run prints one "RESULT <json>"
# line; `make bench` collects them and bench/report.py turns them into a table.
# Defaults are CI-sized. A GPU Benchmark session overrides the env values.
# Through the Gateway, output-token counts are re-counted from text (±1 per
# request): LiteLLM's usage chunk carries an empty choice, which vllm bench
# reads as a token. Compare engines with BASE_URL pointed at the Backend.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: vllm/vllm-openai-cpu:v0.31.0
          command: [sh, -c]
          args:
            - |
              set -eu
              for c in $CONCURRENCY; do
                for r in $(seq "$REPEATS"); do
                  vllm bench serve --backend openai-chat --endpoint /v1/chat/completions \
                    --base-url "$BASE_URL" --served-model-name "$VIRTUAL_MODEL" --model "$TOKENIZER" \
                    --dataset-name random --random-input-len "$INPUT_LEN" --random-output-len "$OUTPUT_LEN" \
                    --ignore-eos --seed 0 --num-prompts "$NUM_PROMPTS" --num-warmups "$WARMUPS" \
                    --max-concurrency "$c" --percentile-metrics ttft,tpot,itl,e2el --metric-percentiles 50,95,99 \
                    --save-result --result-dir /tmp/r --result-filename run.json --disable-tqdm
                  echo "RESULT $(cat /tmp/r/run.json)"
                done
              done
          env:
            - {name: BASE_URL, value: "http://litellm:4000"}
            - {name: VIRTUAL_MODEL, value: chat}
            - {name: TOKENIZER, value: Qwen/Qwen2.5-0.5B-Instruct}   # must match the Backend's model
            - {name: CONCURRENCY, value: "1 2"}
            - {name: REPEATS, value: "1"}
            - {name: NUM_PROMPTS, value: "8"}
            - {name: WARMUPS, value: "1"}
            - {name: INPUT_LEN, value: "128"}
            - {name: OUTPUT_LEN, value: "32"}
            - name: OPENAI_API_KEY   # sent as the Bearer token
              valueFrom:
                secretKeyRef: {name: litellm-master-key, key: key}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
